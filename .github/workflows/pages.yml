# Builds the site from data/ and publishes it to GitHub Pages on every push to main.
# data/ is written by the Pangolin app repo's CI after each merge (tokens.json, catalog
# screenshots, manifest); site/ changes come from pull requests here.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Pillow (trims tall menu screenshots)
        run: pip install pillow==11.3.0
      - name: Build site
        run: python3 site/build.py _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
